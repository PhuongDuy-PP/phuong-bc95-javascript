<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="mx-auto max-w-3xl bg-white rounded-lg p-6">
        <h1 class="text-center text-green-500 text-2xl mb-4">DOM exercise</h1>

        <!-- Bài 1: getElementById + innerText -->
        <div class="bg-blue-200 rounded-lg">
            <h2 class="font-bold text-indigo-500 mb-2">Bài 1: getElementById + innerText</h2>
            <p id="text-result" class="bg-gray-300 p-3 rounded mb-2">Đây là nơi chứa text</p>
            <button id="btn-result" class="bg-orange-400 text-white px-3 py-2 rounded-md">Click</button>
        </div>

        <!-- Bài 2: giả lập flow login -->
         <div class="bg-blue-200 rounded-lg mt-6 p-4">
            <div>
                <label class="block text-sm font-medium mb-1">Username: </label>
                <input
                    type="text"
                    id="input-username"
                    placeholder="Nhập username: "
                    class="w-full border border-gray-600 rounded p-3"
                >
                <!-- thẻ p để hiển thị lỗi nếu có -->
                <p class="hidden bg-red-200 text-white p-3 rounded-lg mt-1"></p>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 mt-2">Password: </label>
                <input
                    type="password"
                    id="input-password"
                    placeholder="Nhập password: "
                    class="w-full border border-gray-600 rounded p-3"
                >
                <!-- thẻ p để hiển thị lỗi nếu có -->
                <p id="result" class="bg-red-200 text-white p-3 rounded-lg mt-1"></p>
            </div>

            <button id="btn-login" class="bg-blue-500 text-white p-2 rounded-lg mt-2">
                Login
            </button>

         </div>

         <!-- Bài 3: tính chu vi, diện tích hình chữ nhật -->
          <div class="bg-blue-200 rounded-lg mt-6 p-4">
            <div>
                <label class="block text-sm font-medium mb-1">Chiều dài: </label>
                <input
                    type="text"
                    id="input-width"
                    placeholder="Nhập chiều dài: "
                    class="w-full border border-gray-600 rounded p-3"
                >
                <!-- thẻ p để hiển thị lỗi nếu có -->
                <p class="hidden bg-red-200 text-white p-3 rounded-lg mt-1"></p>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 mt-2">Chiều rộng: </label>
                <input
                    type="text"
                    id="input-height"
                    placeholder="Nhập chiều rộng: "
                    class="w-full border border-gray-600 rounded p-3"
                >
                <!-- thẻ p để hiển thị lỗi nếu có -->
                <p id="result-hcn" class="bg-red-200 text-white p-3 rounded-lg mt-1"></p>
            </div>

            <button id="btn-hcn" class="bg-blue-500 text-white p-2 rounded-lg mt-2">
                Tính toán
            </button>

         </div>

         <!-- Bài 4: Tính tổng số có 2 chữ số -->
          <div class="bg-blue-200 rounded-lg mt-6 p-4">
            <div>
                <label class="block text-sm font-medium mb-1">Mời bạn nhập số có 2 chữ số: </label>
                <input
                    type="text"
                    id="input-number"
                    placeholder="Nhập số có 2 chữ số: "
                    class="w-full border border-gray-600 rounded p-3"
                >
                <!-- thẻ p để hiển thị lỗi nếu có -->
                <p class="hidden bg-red-200 text-white p-3 rounded-lg mt-1"></p>
            </div>


            <button id="btn-calc" class="bg-blue-500 text-white p-2 rounded-lg mt-2">
                Tính toán
            </button>

            <p id="result-calc" class="bg-blue-200 p-3 rounded-lg mt-1"></p>

         </div>


    </div>


    <!-- thứ tự import file js -->
     <!-- những file js ở cuối sẽ được ưu tiên nhất -->
      <!-- VD: để các file js của thư viên lên đầu, file js của mình sẽ để ở cuối -->
    <script src="js/main.js"></script>
    <script src="js/bai2.js"></script>
    <script src="js/bai3.js"></script>
    <script src="js/bai4.js"></script>
    <script src="js/ifElse.js"></script>
</body>
</html>
