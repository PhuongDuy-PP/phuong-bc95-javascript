<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập mảng số nguyên</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="mx-auto max-w-2xl px-4 py-10">
      <div class="rounded-2xl bg-white p-6 shadow-lg">
        <h1 class="mb-6 text-2xl font-bold">Bài tập mảng số nguyên</h1>

        <section class="mb-8 space-y-3">
          <h2 class="text-lg font-semibold">Nhập số nguyên vào mảng</h2>
          <div class="flex flex-col gap-3 sm:flex-row">
            <input
              id="numberInput"
              type="number"
              step="1"
              placeholder="Nhập số nguyên..."
              class="w-full rounded-lg border border-slate-300 px-4 py-2 outline-none transition focus:border-blue-500"
            />
            <button
              id="btnAdd"
              class="rounded-lg bg-blue-600 px-5 py-2 font-medium text-white transition hover:bg-blue-700"
            >
              Thêm số
            </button>
          </div>
          <p id="arrayDisplay" class="rounded-lg bg-slate-100 px-4 py-3 text-sm">
            Mảng hiện tại: []
          </p>
        </section>

        <section class="space-y-3">
          <h2 class="text-lg font-semibold">Chức năng 1: Tổng các số dương</h2>
          <button
            id="btnSumPositive"
            class="rounded-lg bg-emerald-600 px-5 py-2 font-medium text-white transition hover:bg-emerald-700"
          >
            Tính tổng số dương
          </button>
          <p id="result" class="rounded-lg bg-emerald-50 px-4 py-3 text-sm">
            Kết quả sẽ hiển thị ở đây.
          </p>
        </section>
      </div>
    </main>

    <script type="module" src="./bai1.js"></script>
  </body>
</html>
